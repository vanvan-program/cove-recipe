:root {
  color-scheme: light;
  --ink: #352c20;
  --muted: #695d48;
  --rust: #8e3e28;
  --leaf: #47563d;
  --line: #c6b99a;
  --paper: #f5ecd6;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  display: grid; place-items: center; color: var(--ink);
  font: 15px/1.5 var(--sans); background: #b29b79 var(--desk) center / cover no-repeat;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: transparent; border: 0; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid #854129; outline-offset: 2px;
}
button { touch-action: manipulation; }
::selection { color: #332815; background: #dfc892; }
svg { width: 1.15em; height: 1.15em; flex-shrink: 0; vertical-align: -.17em; }
.notebook {
  position: relative; isolation: isolate; display: flex; flex-direction: column;
  width: clamp(395px, 54dvh, 458px); height: min(890px, calc(100dvh - 44px));
  padding: 0 16px 18px 16px; border-radius: 10px 19px 19px 10px;
  background:
    linear-gradient(90deg,#80573755,transparent 3.5%,#80573759 4.6%,transparent 6%,transparent 92%,#80573738),
    linear-gradient(105deg,#d4ab7ac2,#d4a674a6 49%,#c79868aa),
    var(--hide) center / 260px 180px repeat, #b28255;
  box-shadow: inset 1px 1px 2px #e8c68e, inset -2px -3px 5px #805737, 1px 2px 1px #4c3428, 7px 12px 18px #49321950, 14px 27px 42px #43301e55;
}
.notebook::before { content:""; position:absolute; inset:5px 6px 7px 6px; border: 1.3px dashed #e8c68e; border-radius:6px 14px 13px 5px; opacity:.83; z-index:-1; pointer-events:none; }
.book-brand { display:flex; align-items:center; gap:10px; min-height:58px; flex:none; padding:0 12px; color:#412a1b; text-shadow:0 1px 0 #f4d3a5; }
.book-brand .sprig { width:29px; height:35px; color:#63432a; }
.book-brand .wordmark { font: italic 600 26px/1.15 Georgia, "Times New Roman", serif; letter-spacing:-.7px; }
.emboss { margin-left:auto; color:#745137; width:41px; height:16px; opacity:.86; }
.leaves {
  flex:1; min-height:0; position:relative; isolation:isolate; display:flex; flex-direction:column;
  margin-right:5px; margin-bottom:2px; border-radius:3px 7px 5px 2px;
  background:var(--paper);
  box-shadow: 1px 1px #b8a47d, 3px 2px #ebd4ac, 4px 3px #a78e69, 6px 4px #dfc8a4, 7px 5px #9d8564, 8px 6px #d4b88d, 8px 8px 6px #22150a66;
}
#page-deck { flex:1; min-height:0; position:relative; overflow:hidden; border-radius:3px 7px 0 0; }
.page { background:linear-gradient(90deg,#b8a07833,transparent 5%,transparent 95%,#b2976b17), var(--sheet) center / 290px 198px repeat, var(--paper); }
.page-scroll { padding:20px 18px 24px 23px; scrollbar-width:thin; scrollbar-color:#b5a47d77 transparent; }
.page-scroll::-webkit-scrollbar { width:4px; }
.page-scroll::-webkit-scrollbar-thumb { background:#b9a47f88; border-radius:5px; }
.book-rings { pointer-events:none; position:absolute; z-index:7; left:-9px; top:0; bottom:50px; width:16px; }
.book-rings i { position:absolute; left:0; width:16px; height:7px; border-radius:50% / 45%; background:linear-gradient(#5b462c,#d1b780 22%,#f6e4b3 40%,#b49a6e 59%,#644b30 83%,#493821); box-shadow:0 2px 2px #45351e70; transform:rotate(-8deg); }
.book-rings i::after { content:""; position:absolute; right:-2px; top:-2px; z-index:-1; width:7px; height:11px; border-radius:50%; background:#6d5a40; box-shadow:inset -1px 0 2px #2a221a,1px 1px 1px #fff5d7; }
.book-rings i:first-child { top:16%; } .book-rings i:nth-child(2) { top:52%; } .book-rings i:nth-child(3) { top:88%; }
.book-tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; position:relative; z-index:8; flex:none; padding:6px 8px 5px; border-top:1px solid #c1ad87; border-radius:0 0 5px 2px; background:linear-gradient(#e5d5b6cc,#f0e3cacc),var(--sheet) center/240px; }
.book-tabs button { display:flex; gap:6px; align-items:center; justify-content:center; min-height:44px; color:#66583e; font-size:14px; font-weight:600; padding:3px; border-radius:4px 6px 3px 3px; border:1px solid transparent; }
.book-tabs button svg { width:18px; height:18px; }
.book-tabs button[aria-selected=true] { color:#fff4df; border-color:#68452f; background:linear-gradient(#875d3ff5,#805538f2),var(--sheet) center/220px; box-shadow:inset 0 0 0 2px #dfb87d55, 0 1px 2px #695a3a55; }
.page-heading, .heading-actions, .collection-bar, .shopping-tools, .filter-bar { display:flex; align-items:center; }
.page-heading { min-height:47px; justify-content:space-between; gap:6px; border-bottom:3px double #ac9974; padding-bottom:9px; margin-bottom:12px; }
h1,h2,h3,p { margin:0; }
h1,h2,h3 { text-wrap:balance; }

    const field = el('input');
    field.type = type;
    field.value = value;
    return field;
  }
  function field(label, control) {
    const result = el('label', 'form-field');
    result.append(el('span', '', label), control);
    return result;
  }
  function checkChoice(text, value, checked = false) {
    const label = el('label', 'choice-row');
    const control = input('checkbox', value);
    control.checked = checked;
    label.append(control, el('span', '', text));
    return label;
  }
  const dialog = $('#preview-dialog');
  const form = $('.dialog-form', dialog);
  const body = $('.dialog-body', dialog);
  const dialogActions = $('.dialog-actions', dialog);
  const cancelDialog = () => dialog.close();
  $('.dialog-close', dialog).onclick = cancelDialog;
  dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) cancelDialog();
  });
  function openDialog(title, content, submitLabel, onSubmit) {
    $('#dialog-title').textContent = title;
    body.replaceChildren(...content);
    dialogActions.replaceChildren();
    if (onSubmit) dialogActions.append(button('dialog-secondary', '取消', cancelDialog));
    const submit = el('button', 'dialog-primary', submitLabel || '知道了');
    submit.type = 'submit';
    dialogActions.append(submit);
    form.onsubmit = event => {
      event.preventDefault();
      if (onSubmit && onSubmit() === false) return;
      cancelDialog();
    };
    if (!dialog.open) dialog.showModal();
    else dialog.scrollTop = 0;
  }
  const toast = $('#preview-toast');
  let toastTimer;
  function dismissToast() {
    clearTimeout(toastTimer);
    toast.hidden = true;
  }
  function notify(message) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.hidden = false;
    toastTimer = setTimeout(() => { toast.hidden = true; }, 2200);
  }
  const initialRecipes = [
    {id:1,name:'番茄炒蛋',category:'家常菜',tags:['下饭','快手菜'],prep:5,cook:8,favorite:true,recent:1,ingredients:['番茄','鸡蛋','小葱']},
    {id:2,name:'香菇滑鸡',category:'家常菜',tags:['清蒸'],prep:15,cook:20,favorite:false,recent:0,ingredients:['香菇','鸡肉','姜']},
    {id:3,name:'冬瓜虾皮汤',category:'热汤',tags:['清淡'],prep:5,cook:12,favorite:true,recent:2,ingredients:['冬瓜','虾皮','姜']},
    {id:4,name:'葱油拌面',category:'主食',tags:['夜宵'],prep:5,cook:12,favorite:false,recent:0,ingredients:['小葱','面条']},
    {id:5,name:'清炒青菜',category:'家常菜',tags:['快手菜'],prep:5,cook:8,favorite:false,recent:0,ingredients:['青菜','蒜']}
  ];
  const initialShopping = [
    {id:1,name:'番茄',note:'2 个，挑熟一点的',sources:['番茄炒蛋'],bought:false},
    {id:2,name:'鸡蛋',note:'3 个',sources:['番茄炒蛋'],bought:false},
    {id:3,name:'小葱',note:'1 把',sources:['番茄炒蛋','葱油拌面'],bought:false},
    {id:4,name:'香菇',note:'选新鲜香菇',sources:['香菇滑鸡'],bought:false},
    {id:5,name:'冬瓜',note:'切一小块',sources:['冬瓜虾皮汤'],bought:true}
  ];
  const copy = data => JSON.parse(JSON.stringify(data));
  let recipes = copy(initialRecipes);
  let shopping = copy(initialShopping);
  let removedItem = null;
  let recipeMode = '全部';
  let category = '';
  let sort = '手动排序';
  let multi = false;
  let showBought = true;
  const picked = new Set();
  const recipeList = $('#recipe-list');
  function visibleRecipes() {
    const query = $('#recipe-search').value.trim().toLocaleLowerCase();
    const visible = recipes.filter(r =>
      (!category || r.category === category) &&
      (recipeMode !== '收藏' || r.favorite) && (recipeMode !== '最近使用' || r.recent) &&
      [r.name,r.category,...r.tags,...r.ingredients].join(' ').toLocaleLowerCase().includes(query)
    );
    if (sort === '菜名') visible.sort((a,b) => a.name.localeCompare(b.name,'zh-CN'));
    if (sort === '烹饪时长') visible.sort((a,b) => (a.cook ?? Infinity) - (b.cook ?? Infinity));
    if (recipeMode === '最近使用') visible.sort((a,b) => b.recent - a.recent);
    return visible;
  }
  function describeRecipe(recipe) {
    recipe.recent = Date.now();
    const parts = [el('p','detail-category',recipe.category)];
    if (recipe.ingredients.length) parts.push(el('h3','','食材'), el('p','',recipe.ingredients.join('、')));
    if (recipe.prep != null) parts.push(el('p','','准备 ' + recipe.prep + ' 分钟 · 烹饪 ' + recipe.cook + ' 分钟'));
    if (recipe.tags.length) parts.push(el('p','',recipe.tags.map(t => '#' + t).join('　')));
    renderRecipes();
    openDialog(recipe.name, parts, '收起菜谱');
  }
  function renderRecipes() {
    const shown = visibleRecipes();
    $('#recipe-count').textContent = shown.length + ' 道菜谱';
    $$('.filter-btn').forEach(btn => {
      const active = btn.textContent === recipeMode;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', String(active));
    });
    $('#category-filter span').textContent = category || '全部分类';
    $('#new-recipe').hidden = multi;
    $('#batch-recipes').hidden = !multi;
    $('#batch-recipes').textContent = '将选中的 ' + picked.size + ' 道菜加入购物清单';
    $('#batch-recipes').disabled = !picked.size;
    $('#multi-select').setAttribute('aria-pressed', String(multi));
    recipeList.replaceChildren();
    for (const r of shown) {
      const hero = r.id === 1;
      const card = el('article','recipe-card ' + (hero ? 'hero' : 'compact'));
      const link = button('recipe-link', null, () => {
        if (!multi) return describeRecipe(r);
        if (picked.has(r.id)) picked.delete(r.id); else picked.add(r.id);
        renderRecipes();
        recipeList.querySelector('[data-recipe-id="' + r.id + '"]')?.focus({preventScroll:true});
      });
      link.dataset.recipeId = r.id;
      if (multi) link.setAttribute('aria-pressed', String(picked.has(r.id)));
      if (picked.has(r.id)) card.classList.add('selected');
      if (hero) {
        const photo = el('span','recipe-hero-photo');
        photo.setAttribute('aria-hidden','true');
        link.append(photo);
      }
      const caption = el('div','recipe-caption');
      const tag = el('span','recipe-category',r.category);
      const title = el('h2','recipe-title',r.name);
      if (hero) {
        const pin = el('span','pinned-label','置顶');
        pin.prepend(icon('pin'));
        tag.append(pin);
      }
      const meta = el('span','recipe-meta');
      if (r.prep != null) meta.append(icon('clock'), '准备 ' + r.prep + ' 分 · 烹饪 ' + r.cook + ' 分');
      caption.append(tag,title);
      if (meta.childNodes.length) caption.append(meta);
      if (r.tags.length) caption.append(el('span','recipe-tags',r.tags.map(t => '#' + t).join('  ')));
      link.append(caption);
      card.append(link);
      if (!multi) {
        const fav = button('favorite', null, () => {
          r.favorite = !r.favorite;
          renderRecipes();
          const next = recipeList.querySelector('[data-favorite-id="' + r.id + '"]') || $('.filter-btn.active');
          next?.focus({preventScroll:true});
        });
        fav.dataset.favoriteId = r.id;
        fav.setAttribute('aria-label',(r.favorite ? '取消收藏' : '收藏') + r.name);
        fav.setAttribute('aria-pressed',String(r.favorite));
        fav.append(icon('star',r.favorite));
        card.append(fav);
      }
      recipeList.append(card);
    }
    if (!shown.length) recipeList.append(el('p','empty-state','没有找到菜谱，试试其他关键词或分类。'));
  }
  function singleChoice(title, options, current, select) {
    const group = el('div','dialog-choices');
    for (const option of options) {
      const row = button('choice-row choice-button', option, () => { select(option); cancelDialog(); });
      row.setAttribute('aria-pressed',String(option === current));
      if (option === current) row.append(icon('check'));
      group.append(row);
    }
    openDialog(title,[group],'关闭');
  }
  $('#recipe-search').addEventListener('input',renderRecipes);
  $$('.filter-btn').forEach(btn => btn.onclick = () => { recipeMode = btn.textContent; renderRecipes(); });
  $('#sort-recipes').onclick = () => singleChoice('排序',['手动排序','菜名','烹饪时长'],sort,value => { sort = value; renderRecipes(); });
  $('#category-filter').onclick = () => singleChoice('选择分类',['全部分类',...new Set(recipes.map(r=>r.category))],category || '全部分类',value => {
    category = value === '全部分类' ? '' : value; renderRecipes();
  });
  $('#multi-select').onclick = () => { multi = !multi; picked.clear(); renderRecipes(); };
  $('#batch-recipes').onclick = () => chooseIngredients(recipes.filter(r => picked.has(r.id)));
  $('#new-recipe').onclick = () => {
    const name = input('text'); name.required = true; name.maxLength = 60; name.placeholder = '例如：蒜蓉蒸虾';
    const cat = el('select');
    for (const c of [...new Set(recipes.map(r=>r.category)), '未分类']) { if (![...cat.options].some(o=>o.value===c)) cat.add(new Option(c,c)); }
    const ingredients = input('text'); ingredients.maxLength = 240; ingredients.placeholder = '用顿号或逗号分隔';
    openDialog('新建菜谱',[field('菜名',name),field('分类',cat),field('食材（可选）',ingredients)],'保存菜谱',() => {
      if (!name.value.trim()) { name.value = ''; name.reportValidity(); return false; }
      const r = {id:Date.now(), name:name.value.trim(), category:cat.value,tags:[],prep:null,cook:null,favorite:false,recent:0,ingredients:ingredients.value.split(/[、，,]/).map(s=>s.trim()).filter(Boolean)};
      recipes.splice(recipes[0]?.id === 1 ? 1 : 0,0,r);
      $('#recipe-search').value = ''; recipeMode = '全部'; category = ''; sort = '手动排序';
      renderRecipes(); notify('已保存「' + r.name + '」');
    });
  };
  function editItem(item) {
    const name = input('text',item?.name || '');
    name.required = true;
    name.maxLength = 60;
    const note = input('text',item?.note || '');
    note.maxLength = 200;
    openDialog(item ? '编辑食材' : '添加食材',[field('食材名称',name),field('采购备注（可选）',note)],'保存',() => {
      if (!name.value.trim()) { name.value = ''; name.reportValidity(); return false; }
      const values = {name:name.value.trim(),note:note.value.trim()};
      if (item) Object.assign(item,values);
      else {
        const match = shopping.find(i => i.name === values.name);
        if (match) { match.bought = false; if (values.note) match.note = values.note; }
        else shopping.push({id:Date.now(), ...values, sources:[],bought:false});
      }
      renderShopping(); notify('已保存「' + values.name + '」');
    });
  }
  function shoppingRow(item) {
    const row = el('div','shopping-row' + (item.bought ? ' bought' : ''));
    const toggle = button('check-item',null,() => {
      item.bought = !item.bought;
      renderShopping();
      const next = document.querySelector('[data-check-id="' + item.id + '"]') || $('#show-bought');
      next.focus({preventScroll:true});
    });
    toggle.dataset.checkId = item.id;
    toggle.setAttribute('role','checkbox');
    toggle.setAttribute('aria-checked',String(item.bought));
    toggle.setAttribute('aria-label',item.name);
    if (item.bought) toggle.append(icon('check'));
    const details = button('shopping-info',null,() => editItem(item));
    details.append(el('strong','item-name',item.name));
    if (item.sources.length) details.append(el('span','item-source','来自：' + item.sources.join('、')));
    if (item.note) details.append(el('span','item-note',item.note));
    const remove = button('row-remove',null,() => {
      const position = shopping.indexOf(item);
      removedItem = {item, position};
      shopping.splice(position, 1);
      dismissToast();
      renderShopping();
    });
    remove.setAttribute('aria-label','删除' + item.name);
    remove.append(icon('trash'));
    row.append(toggle,details,remove);
    return row;
  }
  function renderShopping() {
    if (removedItem && shopping.some(item => item.name === removedItem.item.name)) removedItem = null;
    $('#undo-item').hidden = !removedItem;
    if (removedItem) $('#undo-item').setAttribute('aria-label','撤销删除' + removedItem.item.name);
    const pending = shopping.filter(i => !i.bought);
    const bought = shopping.filter(i => i.bought);
    $('#shopping-summary').textContent = '待买 ' + pending.length + ' 项 · 已买 ' + bought.length + ' 项';
    $('#pending-count').textContent = '待买 ' + pending.length + ' 项';
    $('#pending-list').replaceChildren(...pending.map(shoppingRow));
    if (!pending.length) $('#pending-list').append(el('p','empty-state',bought.length ? '清单上的食材都买齐了。' : '从菜谱添加食材，或手动记下要买的东西。'));
    const boughtControl = $('#show-bought');
    boughtControl.replaceChildren('已买 ' + bought.length + ' 项', icon('down'));
    boughtControl.setAttribute('aria-expanded',String(showBought));
    $('#bought-list').hidden = !showBought;
    $('#bought-list').replaceChildren(...bought.map(shoppingRow));
    $('#clear-bought').disabled = !bought.length;
    $('#clear-shopping').disabled = !shopping.length;
  }
  function chooseIngredients(chosenRecipes) {
    const sources = new Map();
    for (const r of chosenRecipes) for (const ingredient of r.ingredients) {
      if (!sources.has(ingredient)) sources.set(ingredient,new Set());
      sources.get(ingredient).add(r.name);
    }
    if (!sources.size) {
      openDialog('选择食材',[el('p','','所选菜谱还没有食材。')]);
      return;
    }
    const group = el('div','dialog-choices');
    for (const name of sources.keys()) group.append(checkChoice(name,name,true));
    openDialog('选择食材',[group],'加入购物清单',() => {
      const chosen = $$('input:checked',group).map(n => n.value);
      if (!chosen.length) return false;
      let id = Math.max(0,...shopping.map(i => i.id)) + 1;
      for (const name of chosen) {
        let item = shopping.find(s => s.name === name);
        if (!item) {
          item = {id:id++,name,note:'',sources:[],bought:false};
          shopping.push(item);
        }
        item.bought = false;
        item.sources = [...new Set([...item.sources,...sources.get(name)])];
      }
      renderShopping();
      if (multi) { multi = false; picked.clear(); renderRecipes(); }
      notify('已将 ' + chosen.length + ' 项食材加入购物清单');
    });
    group.onchange = () => { $('.dialog-primary',dialog).disabled = !group.querySelector('input:checked'); };
  }
  $('#undo-item').onclick = () => {
    if (!removedItem) return;
    const {item, position} = removedItem;
    if (shopping.some(other => other.id === item.id)) item.id = Math.max(...shopping.map(other => other.id)) + 1;
    shopping.splice(position, 0, item);
    removedItem = null;
    renderShopping();
  };
  $('#new-item').onclick = () => editItem();
  $('#show-bought').onclick = () => { showBought = !showBought; renderShopping(); };
  function clearShopping(boughtOnly) {
    shopping = boughtOnly ? shopping.filter(item => !item.bought) : [];
    removedItem = null;
    dismissToast();
    renderShopping();
  }
  $('#clear-shopping').onclick = () => openDialog('清空购物清单',[el('p','','删除本次预览里的全部待买和已买食材？')],'清空',() => clearShopping(false));
  $('#clear-bought').onclick = () => clearShopping(true);
  $('#add-from-recipe').onclick = () => {
    const group = el('div','dialog-choices');
    for (const r of recipes) group.append(checkChoice(r.name,r.id));
    openDialog('选择菜谱',[group],'下一步',() => {
      const ids = new Set($$('input:checked',group).map(n => Number(n.value)));
      if (ids.size) chooseIngredients(recipes.filter(r => ids.has(r.id)));
      return false;
    });
    const submit = $('.dialog-primary',dialog);
    submit.disabled = true;
    group.onchange = () => { submit.disabled = !group.querySelector('input:checked'); };
  };

  let snapshot = null;
  const permissions = {alarm:true, notifications:true};
  function showPermission(key) {
    const label = key === 'alarm' ? '精确闹钟' : '通知';
    const option = checkChoice('允许' + label,key,permissions[key]);
    openDialog(label + '设置',[el('p','','在预览中模拟系统权限。'),option],'应用',() => {
      permissions[key] = $('input',option).checked;
      const names = [];
      if (!permissions.alarm) names.push('精确闹钟');
      if (!permissions.notifications) names.push('通知');
      $('#permission-state').textContent = names.length ? names.join('与') + '待开启' : '精确闹钟与通知已允许';
      notify('已更新预览权限');
    });
  }
  const settings = {
    taxonomy() {
      const categories = [...new Set(recipes.map(r => r.category))];
      const tags = [...new Set(recipes.flatMap(r => r.tags))];
      openDialog('分类与标签管理',[el('h3','','分类'),el('p','',categories.join(' · ')),el('h3','','标签'),el('p','',tags.join(' · '))]);
    },
    trash() { openDialog('回收站',[el('p','','预览回收站为空。')]); },
    export() {
      openDialog('导出完整备份',[el('p','','将当前的 ' + recipes.length + ' 道菜谱与 ' + shopping.length + ' 项购物食材保存为本页的临时备份。刷新页面会清除这份备份。')],'模拟导出',() => {
        snapshot = copy({recipes,shopping}); notify('预览备份已保存');
      });
    },
    restore() {
      if (!snapshot) {
        openDialog('从备份恢复',[el('p','','请先点「导出完整备份」，创建一份可在本次预览中恢复的备份。')]);
        return;
      }
      openDialog('从备份恢复',[el('p','','恢复会替换本次预览中的菜谱和购物清单。备份内有 ' + snapshot.recipes.length + ' 道菜谱、' + snapshot.shopping.length + ' 项食材。')],'确认恢复',() => {
        const data = copy(snapshot); recipes = data.recipes; shopping = data.shopping; removedItem = null;
        multi = false; picked.clear(); category = ''; recipeMode = '全部'; $('#recipe-search').value = '';
        renderRecipes(); renderShopping(); notify('已恢复预览备份');
      });
    },
    alarm() { showPermission('alarm'); },
    notifications() { showPermission('notifications'); },
    version() { openDialog('关于版本',[el('h3','','Cove Recipe'),el('p','','当前版本 v1.5.2'),el('p','','自己的家庭菜谱本 · 离线 · 无账号 · 无广告')]); }
  };
  $$('[data-setting]').forEach(control => { control.onclick = settings[control.dataset.setting]; });
  renderRecipes();
  renderShopping();
})();
</script>

<style>
#page-deck {
  position: relative;
  isolation: isolate;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
#page-deck > .page {
  position: absolute;
  inset: 0;
  z-index: 0;
  visibility: hidden;
  pointer-events: none;
  background-color: var(--paper, #f8efd9);
}
#page-deck > .page.is-current {
  visibility: visible;
  pointer-events: auto;
  z-index: 1;
}
#page-deck > .page.is-entering {
  visibility: visible;
  z-index: 1;
}
#page-deck > .page.moving-sheet {
  z-index: 2;
  will-change: transform;
  transform-origin: 42% 62%;
  border-radius: 2px 6px 4px 2px;
  box-shadow: 3px 4px 9px #48321f52;
}
#page-deck:has(> .is-entering) > .page { pointer-events: none; }
#page-deck .page-scroll {
  box-sizing: border-box;
  height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y pinch-zoom;
}
#page-deck.turn-dragging { user-select: none; cursor: grabbing; }
</style>
<script>
(() => {
  function bindNotebookTurn() {
    const deck = document.getElementById('page-deck');
    const pages = Array.from(deck.querySelectorAll(':scope > .page[data-page]'));
    const tabs = Array.from(document.querySelectorAll('[role="tab"][data-tab]'));
    if (!pages.length || pages.length !== tabs.length) return;

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let current = 0;
    let requested = 0;
    let turn = null;
    let gesture = null;
    let frame = 0;
    let suppressClickUntil = 0;

    for (let i = 0; i < pages.length; i++) {
      const page = pages[i], tab = tabs[i];
      page.id ||= 'notebook-panel-' + i;
      tab.id ||= 'notebook-tab-' + i;
      tab.setAttribute('aria-controls', page.id);
      page.setAttribute('role', 'tabpanel');
      page.setAttribute('aria-labelledby', tab.id);
    }
    function syncTabs() {
      tabs.forEach((tab, index) => {
        const selected = index === requested;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
    }
    function showPage(index) {
      cancelAnimationFrame(frame);
      frame = 0;
      turn = null;
      current = index;
      pages.forEach((page, i) => {
        const active = i === index;
        page.classList.toggle('is-current', active);
        page.classList.remove('is-entering', 'moving-sheet');
        page.inert = !active;
        page.setAttribute('aria-hidden', String(!active));
        page.style.removeProperty('transform');
      });
      syncTabs();
    }
    function paint(progress) {
      turn.progress = Math.min(1, Math.max(0, progress));
      if (reducedMotion.matches) return;
      // Advance by taking the top sheet away. Going back lays the same sheet down.
      const travel = turn.forward ? turn.progress : 1 - turn.progress;
      const angle = -3.4 * Math.sin(travel * Math.PI / 2);
      const x = -turn.distance * travel;
      const y = -6 * travel;
      turn.sheet.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + angle + 'deg)';
    }
    function begin(target) {
      const forward = target > current;
      const sheet = pages[forward ? current : target];
      turn = { to: target, forward, sheet, width: deck.clientWidth,
        distance: deck.clientWidth + deck.clientHeight * 0.06, progress: 0, endpoint: null };
      if (!reducedMotion.matches) {
        pages[target].classList.add('is-entering');
        sheet.classList.add('moving-sheet');
      }
      paint(0);
    }
    function finish(endpoint) {
      const next = endpoint ? turn.to : current;
      showPage(next);
      if (current !== requested) goTo(requested);
    }
    function animate(endpoint) {
      if (frame && turn.endpoint === endpoint) return;
      cancelAnimationFrame(frame);
      turn.endpoint = endpoint;
      const from = turn.progress;
      if (reducedMotion.matches || Math.abs(endpoint - from) < 0.001) {
        finish(endpoint);
        return;
      }
      const start = performance.now();
      const duration = Math.max(85, 340 * Math.abs(endpoint - from));
      function tick(now) {
        const time = Math.min(1, Math.max(0, (now - start) / duration));
        // Ease the sheet to rest as it leaves or returns to the stack.
        const ease = time * time * (3 - 2 * time);
        paint(from + (endpoint - from) * ease);
        if (time === 1) finish(endpoint);
        else frame = requestAnimationFrame(tick);
      }
      frame = requestAnimationFrame(tick);
    }
    function goTo(target) {
      if (target < 0 || target >= pages.length) return;
      if (gesture) clearGesture();
      requested = target;
      syncTabs();
      if (reducedMotion.matches) { showPage(target); return; }
      if (!turn) {
        if (target === current) return;
        begin(target);
      }
      // When interrupted by a third tab, finish the shorter half-turn,
      // then go directly to the latest request.
      const end = target === turn.to || (target !== current && turn.progress >= 0.5);
      animate(end ? 1 : 0);
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => goTo(index));
      tab.addEventListener('keydown', event => {
        const next = { ArrowLeft: (index + tabs.length - 1) % tabs.length,
          ArrowRight: (index + 1) % tabs.length, Home: 0, End: tabs.length - 1 }[event.key];
        if (next === undefined) return;
        event.preventDefault();
        tabs[next].focus();
        goTo(next);
      });
    });

    function clearGesture() {
      const ended = gesture;
      gesture = null;
      deck.classList.remove('turn-dragging');
      if (ended && deck.hasPointerCapture(ended.id)) deck.releasePointerCapture(ended.id);
    }
    deck.addEventListener('pointerdown', event => {
      if (turn || gesture || !event.isPrimary || event.button !== 0) return;
      if (event.target.closest('input, select, textarea, [contenteditable="true"], [data-no-swipe]')) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, dragging: false };
    });
    window.addEventListener('pointermove', event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
      if (!gesture.dragging) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
        if (Math.abs(dx) <= Math.abs(dy) * 1.2) { clearGesture(); return; }
        gesture.dragging = true;
        deck.setPointerCapture(event.pointerId);
        deck.classList.add('turn-dragging');
      }
      event.preventDefault();
      const target = current + (dx < 0 ? 1 : -1);
      if (turn && target !== turn.to) showPage(current);
      if (!turn && dx && target >= 0 && target < pages.length) begin(target);
      if (turn) paint(Math.abs(dx) / Math.max(1, turn.width));
    }, { passive: false });
    function endDrag(event, cancelled) {
      if (!gesture || gesture.id !== event.pointerId) return;
      const dragging = gesture.dragging;
      if (dragging) suppressClickUntil = performance.now() + 250;
      clearGesture();
      if (!dragging || !turn) return;
      const commit = !cancelled && turn.progress > 0.25;
      requested = commit ? turn.to : current;
      syncTabs();
      animate(commit ? 1 : 0);
    }
    window.addEventListener('pointerup', event => endDrag(event, false));
    window.addEventListener('pointercancel', event => endDrag(event, true));
    deck.addEventListener('lostpointercapture', event => {
      if (event.target === deck) endDrag(event, true);
    });
    deck.addEventListener('click', event => {
      if (performance.now() < suppressClickUntil && event.detail !== 0) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
    function resetMotion() {
      if (gesture) clearGesture();
      showPage(requested);
    }
    reducedMotion.addEventListener('change', resetMotion);
    window.addEventListener('blur', () => { if (gesture) resetMotion(); });
    showPage(0);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindNotebookTurn, { once: true });
  else bindNotebookTurn();
})();
</script>
</body>
</html>
