name: Android build
on:
  push:
    branches: ['cove-recipe-1.5.2']
    tags: ['v1.5.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Windows signing script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Sign-CoveRecipe.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
      - name: Assemble and test
        run: bash gradlew :app:assembleRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain --max-workers=2
      - name: Verify unsigned APK and prepare signing kit
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/signing-kit"
          mkdir -p "$kit"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$kit/CoveRecipe-1.5.2-unsigned.apk"
          cp scripts/Sign-CoveRecipe.ps1 scripts/Sign.cmd "$kit/"
          cd "$kit"
          apk=CoveRecipe-1.5.2-unsigned.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          unzip -tq "$apk"
          "$sdk/zipalign" -c 4 "$apk"
          "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -E "^package: name='cn\.myrecipe\.app' versionCode='8' versionName='1\.5\.2'" "$RUNNER_TEMP/badging.txt"
          if "$sdk/apksigner" verify "$apk" >/dev/null 2>&1; then echo "Expected unsigned APK"; exit 1; fi
          sha256sum "$apk" | tee SHA256SUMS.txt
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: CoveRecipe-1.5.2-Windows-signing-kit
          path: ${{ runner.temp }}/signing-kit/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: instrumented-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 1
  device-tests:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: instrumented-apks
          path: app/build/outputs/apk
      - name: Enable emulator acceleration
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Run regressions on a fresh Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/test-release-device.sh
